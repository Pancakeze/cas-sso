<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>演示子系统 - ehl-uc</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .cyber-gradient { background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%); }
    .neon-text { text-shadow: 0 0 10px rgba(0, 240, 255, 0.7); }
  </style>
</head>
<body class="cyber-gradient min-h-screen text-white">
  <div class="container mx-auto px-6 py-12">
    <div class="max-w-4xl mx-auto">
      <!-- 头部 -->
      <div class="text-center mb-12">
        <div class="inline-flex items-center justify-center w-24 h-24 bg-gradient-to-br from-cyan-400/20 to-purple-500/20 rounded-full mb-6 border border-cyan-400/30">
          <span class="text-4xl">🔐</span>
        </div>
        <h1 class="text-4xl font-bold neon-text mb-4">ehl-uc 统一用户中心</h1>
        <p class="text-gray-400 text-lg">通过 CAS SSO 单点登录访问</p>
      </div>

      <!-- 登录信息卡片 -->
      <div class="bg-gray-800/50 backdrop-blur-sm rounded-2xl p-8 border border-gray-700 mb-8">
        <h2 class="text-2xl font-semibold mb-6 text-cyan-400">✅ 登录成功</h2>
        
        <div class="grid md:grid-cols-2 gap-6">
          <div>
            <div class="text-gray-400 text-sm mb-1">当前用户</div>
            <div class="text-xl font-semibold" id="username">-</div>
          </div>
          
          <div>
            <div class="text-gray-400 text-sm mb-1">用户令牌</div>
            <div class="text-sm font-mono text-green-400 break-all" id="userToken">-</div>
          </div>
          
          <div>
            <div class="text-gray-400 text-sm mb-1">时间戳</div>
            <div class="text-sm font-mono" id="timestamp">-</div>
          </div>
          
          <div>
            <div class="text-gray-400 text-sm mb-1">随机数</div>
            <div class="text-sm font-mono" id="nonce">-</div>
          </div>
        </div>
        
        <div class="mt-6">
          <div class="text-gray-400 text-sm mb-1">完整令牌信息</div>
          <div class="bg-gray-900/50 p-4 rounded-lg text-xs font-mono text-gray-300 break-all" id="fullInfo">
            加载中...
          </div>
        </div>
      </div>

      <!-- 功能菜单 -->
      <div class="bg-gray-800/50 backdrop-blur-sm rounded-2xl p-8 border border-gray-700">
        <h3 class="text-xl font-semibold mb-6 text-purple-400">🚀 可用功能</h3>
        
        <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-4">
          <div class="bg-gray-900/50 p-6 rounded-xl border border-gray-700 hover:border-cyan-400/50 transition-all cursor-pointer">
            <div class="text-3xl mb-3">👤</div>
            <div class="font-semibold mb-1">用户管理</div>
            <div class="text-sm text-gray-400">管理系统用户信息</div>
          </div>
          
          <div class="bg-gray-900/50 p-6 rounded-xl border border-gray-700 hover:border-cyan-400/50 transition-all cursor-pointer">
            <div class="text-3xl mb-3">🔑</div>
            <div class="font-semibold mb-1">权限管理</div>
            <div class="text-sm text-gray-400">配置角色和权限</div>
          </div>
          
          <div class="bg-gray-900/50 p-6 rounded-xl border border-gray-700 hover:border-cyan-400/50 transition-all cursor-pointer">
            <div class="text-3xl mb-3">📊</div>
            <div class="font-semibold mb-1">操作日志</div>
            <div class="text-sm text-gray-400">查看用户操作记录</div>
          </div>
          
          <div class="bg-gray-900/50 p-6 rounded-xl border border-gray-700 hover:border-cyan-400/50 transition-all cursor-pointer">
            <div class="text-3xl mb-3">⚙️</div>
            <div class="font-semibold mb-1">系统配置</div>
            <div class="text-sm text-gray-400">配置系统参数</div>
          </div>
          
          <div class="bg-gray-900/50 p-6 rounded-xl border border-gray-700 hover:border-cyan-400/50 transition-all cursor-pointer">
            <div class="text-3xl mb-3">🔐</div>
            <div class="font-semibold mb-1">安全设置</div>
            <div class="text-sm text-gray-400">配置安全策略</div>
          </div>
          
          <div class="bg-gray-900/50 p-6 rounded-xl border border-gray-700 hover:border-cyan-400/50 transition-all cursor-pointer">
            <div class="text-3xl mb-3">📈</div>
            <div class="font-semibold mb-1">统计分析</div>
            <div class="text-sm text-gray-400">查看统计数据</div>
          </div>
        </div>
      </div>

      <!-- 底部信息 -->
      <div class="text-center mt-12 text-gray-500">
        <p>演示子系统 - 用于测试 CAS SSO 集成</p>
        <p class="text-sm mt-2">Token 验证服务端点: <code class="bg-gray-900/50 px-2 py-1 rounded">POST /token-server/sapi/validateusertoken</code></p>
      </div>
    </div>
  </div>

  <script>
    // 解析 URL 参数
    function getUrlParams() {
      const params = new URLSearchParams(window.location.search);
      return {
        userToken: params.get('userToken') || '未提供',
        username: params.get('username') || '未提供',
        timestamp: params.get('timestamp') || '未提供',
        nonce: params.get('nonce') || '未提供',
        from: params.get('from') || '未提供'
      };
    }

    // 显示信息
    function displayInfo() {
      const params = getUrlParams();
      
      document.getElementById('username').textContent = params.username;
      document.getElementById('userToken').textContent = params.userToken;
      document.getElementById('timestamp').textContent = new Date(parseInt(params.timestamp)).toLocaleString();
      document.getElementById('nonce').textContent = params.nonce;
      
      const fullInfo = `{
  "userToken": "${params.userToken}",
  "username": "${params.username}",
  "timestamp": "${params.timestamp}",
  "nonce": "${params.nonce}",
  "from": "${params.from}"
}`;
      document.getElementById('fullInfo').textContent = fullInfo;

      // 验证 token（可选）
      if (params.userToken && params.userToken !== '未提供') {
        console.log('开始验证 userToken:', params.userToken);
        
        // 调用验证接口
        fetch('http://localhost:8443/token-server/sapi/validateusertoken?userToken=' + params.userToken)
          .then(res => res.json())
          .then(data => {
            console.log('Token 验证结果:', data);
            if (data.status === '0000') {
              console.log('✅ Token 验证通过');
            } else {
              console.log('❌ Token 验证失败:', data.message);
            }
          })
          .catch(err => {
            console.error('验证请求失败:', err);
          });
      }
    }

    // 页面加载完成后显示信息
    document.addEventListener('DOMContentLoaded', displayInfo);

    // 添加功能卡片的点击事件
    document.querySelectorAll('.cursor-pointer').forEach(card => {
      card.addEventListener('click', function() {
        const title = this.querySelector('.font-semibold').textContent;
        alert(`功能开发中: ${title}`);
      });
    });
  </script>
</body>
</html>
