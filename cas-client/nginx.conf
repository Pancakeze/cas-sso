# ============================================================
# Nginx HTTP 配置
# 前端 HTTP，代理到后端 HTTPS
# ============================================================

server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 安全响应头
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;

    # 反向代理 CAS 后端（HTTPS 8443）
    location /cas/ {
        proxy_pass https://cas-server:8443/cas/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # HTTPS 证书验证（自签名证书需跳过验证）
        proxy_ssl_verify off;
    }

    location /token-server/ {
        proxy_pass https://cas-server:8443/token-server/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_ssl_verify off;
    }

    location /uac/ {
        proxy_pass https://cas-server:8443/uac/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_ssl_verify off;
    }

    # React Router：所有路由返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
}
