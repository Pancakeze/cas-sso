server:
  port: ${SERVER_PORT:8080}
  # 支持 Nginx 反向代理的 X-Forwarded-* 头
  forward-headers-strategy: native

spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
  thymeleaf:
    cache: false
    prefix: classpath:/templates/

# JWT 配置
jwt:
  secret: ${JWT_SECRET:cas-sso-secret-key-must-be-at-least-256-bits-long}
  expiration: ${JWT_EXPIRATION:86400000}  # 毫秒，默认24小时

cas:
  ticket:
    service:
      lifetime: 300
    granting:
      lifetime: 86400
  cookie:
    name: CASTGC
    http-only: true
