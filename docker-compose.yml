version: '3'

services:
  # ──────────────────────────────────────────────────────
  # CAS 后端服务（HTTP）
  # ──────────────────────────────────────────────────────
  cas-server:
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
    image: cas-server:1.0.0
    container_name: cas-server
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      # 从挂载的配置文件读取，支持热更新
      SPRING_CONFIG_LOCATION: file:/config/
    volumes:
      # 挂载外部配置目录，容器内外同步
      - ./config/server:/config:ro
    depends_on:
      - redis
    networks:
      - sso-net

  # ──────────────────────────────────────────────────────
  # Redis（本地测试用）
  # ──────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: cas-redis
    restart: unless-stopped
    networks:
      - sso-net

  # ──────────────────────────────────────────────────────
  # CAS 前端门户（HTTP）
  # ──────────────────────────────────────────────────────
  cas-portal:
    build:
      context: ./cas-client
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
    image: cas-portal:1.0.0
    container_name: cas-portal
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # 挂载外部配置文件，支持热更新（不重新构建镜像）
      - ./config/portal/config.json:/usr/share/nginx/html/config.json:ro
    depends_on:
      - cas-server
    networks:
      - sso-net

networks:
  sso-net:
    driver: bridge
