services:
  # ──────────────────────────────────────────────────────
  # CAS 后端服务（HTTP）
  # ──────────────────────────────────────────────────────
  cas-server:
    image: cas-server:1.0.0
    container_name: cas-server
    restart: unless-stopped
    ports:
      - "8083:8080"   # 宿主机 8083 映射到容器 8080
    # 外置配置映射：修改宿主机 config/server/application.yml 后重启生效
    volumes:
      - ./config/server/application.yml:/app/config/application.yml:ro
    environment:
      - SPRING_CONFIG_LOCATION=classpath:/,file:/app/config/application.yml
    networks:
      - sso-net

  # ──────────────────────────────────────────────────────
  # CAS 前端门户（HTTP）
  # ──────────────────────────────────────────────────────
  cas-portal:
    image: cas-portal:1.0.0
    container_name: cas-portal
    restart: unless-stopped
    ports:
      - "3000:3000"
    # 外置配置映射：修改宿主机 config/portal/config.json 后刷新浏览器生效
    volumes:
      - ./config/portal/config.json:/usr/share/nginx/html/config.json:ro
    depends_on:
      - cas-server
    networks:
      - sso-net

networks:
  sso-net:
    driver: bridge
